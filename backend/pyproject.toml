[project]
name = "har-analyzer-backend"
version = "2.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pylint.main]
py-version = "3.14"

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
# schemas.py's Pydantic models intentionally mirror core/models.py's
# dataclasses field-for-field (EntrySummary/EntryDetail <-> ParsedEntry,
# HarAnalysisModel <-> HarAnalysis) -- that's the API/domain boundary
# doing its job, not copy-paste.
disable = ["duplicate-code"]

[tool.pylint.design]
# Building an API response object field-by-field (EntrySummary, HAR entry
# parsing, ...) naturally collects one local per field; that's verbosity,
# not complexity, so the default of 15 is too tight for this codebase's
# own pattern.
max-locals = 20

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
