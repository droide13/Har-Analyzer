[project]
name = "Har-Analyzer"
version = "0.1.0"

[tool.pylint.main]
py-version = "3.14"

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
# Streamlit render methods collect one local per widget by nature; 15 is too
# tight for that pattern without hurting readability.
max-locals = 20

[tool.pylint.similarities]
# StandardizeInputs (tabs/metadata/metadata.py) intentionally mirrors
# HarAnalysis's (core/models.py) field list: one is the raw form input, the
# other the validated record built from it. Past the default of 4 lines so
# that expected overlap doesn't flag, while still catching bigger dupes.
min-similarity-lines = 6

[tool.black]
line-length = 100

[tool.isort]
profile = "black"